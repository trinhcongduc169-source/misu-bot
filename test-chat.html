<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MISU Bot – Test Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f0eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      color: #3b2a1a;
      letter-spacing: 0.05em;
    }

    header p {
      color: #7a6352;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    #mode-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #e6d5c3;
      color: #6b4c30;
    }

    #chat-container {
      width: 100%;
      max-width: 640px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 70vh;
      min-height: 400px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.bot {
      background: #f0e8df;
      color: #3b2a1a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.bot a {
      color: #7a4f2e;
      text-decoration: underline;
      text-underline-offset: 2px;
      word-break: break-all;
    }

    .message.bot a:hover {
      color: #5a3520;
    }

    .message.user {
      background: #c8a882;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.error {
      background: #fde8e8;
      color: #c0392b;
      align-self: center;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    /* Nút CTA đặt hàng */
    .cta-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 20px;
      background: #a0714f;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      letter-spacing: 0.01em;
      margin-top: -4px;
      transition: background 0.18s, transform 0.1s, box-shadow 0.18s;
      box-shadow: 0 2px 8px rgba(100, 60, 20, 0.18);
    }

    .cta-btn:hover {
      background: #8a5f40;
      box-shadow: 0 4px 12px rgba(100, 60, 20, 0.28);
    }

    .cta-btn:active {
      transform: scale(0.97);
    }

    .cta-icon {
      font-size: 1rem;
    }

    .typing {
      align-self: flex-start;
      color: #9e8878;
      font-size: 0.82rem;
      padding: 6px 10px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #input-area {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #ede5dc;
    }

    #user-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #d6c4b2;
      border-radius: 24px;
      font-size: 0.9rem;
      outline: none;
      resize: none;
      background: #faf7f4;
      transition: border-color 0.2s;
      font-family: inherit;
      height: 44px;
      overflow: hidden;
    }

    #user-input:focus {
      border-color: #c8a882;
    }

    #send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: #c8a882;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    #send-btn:hover { background: #b8926d; }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { background: #d9cfc6; cursor: not-allowed; }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 16px;
    }

    .chip {
      padding: 6px 14px;
      background: #f0e8df;
      border: 1px solid #d6c4b2;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #6b4c30;
      cursor: pointer;
      transition: background 0.15s;
    }

    .chip:hover { background: #e3d0bc; }

    #server-url-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.8rem;
    }

    #server-url-row label { color: #7a6352; }

    #server-url {
      padding: 4px 10px;
      border: 1px solid #d6c4b2;
      border-radius: 8px;
      font-size: 0.8rem;
      background: #faf7f4;
      color: #3b2a1a;
      flex: 1;
      max-width: 300px;
    }
  </style>
</head>
<body>

<header>
  <h1>🪵 MISU Bot</h1>
  <p>Trợ lý tư vấn kệ module thông minh</p>
  <span id="mode-badge">Đang kiểm tra...</span>
</header>

<div id="server-url-row">
  <label>Server:</label>
  <input id="server-url" type="text" value="http://localhost:3000" />
</div>

<div id="chat-container">
  <div id="messages"></div>

  <div class="quick-chips" id="quick-chips">
    <span class="chip" onclick="sendChip(this)">Kệ cho nhà bếp</span>
    <span class="chip" onclick="sendChip(this)">Kệ cho phòng khách</span>
    <span class="chip" onclick="sendChip(this)">Kệ độc lập và module nối khác gì nhau?</span>
    <span class="chip" onclick="sendChip(this)">Kích thước có gì?</span>
    <span class="chip" onclick="sendChip(this)">Màu sắc có gì?</span>
    <span class="chip" onclick="sendChip(this)">Tôi muốn đặt hàng</span>
    <span class="chip" onclick="sendChip(this)">Gửi form đặt hàng</span>
  </div>

  <div id="input-area">
    <textarea id="user-input" placeholder="Nhắn tin hỏi MISU Bot..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const modeBadge  = document.getElementById('mode-badge');
  const serverUrlEl = document.getElementById('server-url');

  let chatHistory = [];
  let isLoading   = false;
  let orderFormUrl = '';  // đọc từ /health

  // ─── Domain MISU order form (fallback nếu chưa đọc được từ server) ──────────
  const ORDER_DOMAIN = 'misu-order-api.onrender.com';

  function getServerUrl() {
    return serverUrlEl.value.replace(/\/$/, '');
  }

  // ─── Health check – lấy luôn orderFormUrl từ server ─────────────────────────
  async function checkHealth() {
    try {
      const res  = await fetch(getServerUrl() + '/health');
      const data = await res.json();
      orderFormUrl = data.orderFormUrl || '';
      modeBadge.textContent = data.mode === 'openai' ? '✅ OpenAI API' : '⚡ Fallback Mode';
      modeBadge.style.background = data.mode === 'openai' ? '#d4edda' : '#fff3cd';
      modeBadge.style.color      = data.mode === 'openai' ? '#155724' : '#856404';
    } catch {
      modeBadge.textContent = '❌ Server chưa chạy';
      modeBadge.style.background = '#fde8e8';
      modeBadge.style.color = '#c0392b';
    }
  }

  checkHealth();

  // ─── Render helpers ───────────────────────────────────────────────────────────

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Tách URL ra khỏi text, render URL thành <a>, phần còn lại áp markdown
  function renderMarkdown(rawText) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    const parts = rawText.split(urlRegex);

    return parts.map(part => {
      if (/^https?:\/\//.test(part)) {
        const safe = escapeHtml(part);
        return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${safe}</a>`;
      }
      return escapeHtml(part)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    }).join('');
  }

  // Kiểm tra reply bot có chứa link form đặt hàng không
  function detectOrderUrl(text) {
    const urlMatch = text.match(/https?:\/\/[^\s]+/g) || [];
    for (const url of urlMatch) {
      if (url.includes(ORDER_DOMAIN)) return url;
      if (orderFormUrl && url.includes(orderFormUrl)) return url;
    }
    // Nếu orderFormUrl được set và text chứa nó (dù không phải URL dạng đầy đủ)
    if (orderFormUrl && text.includes(orderFormUrl)) return orderFormUrl;
    return null;
  }

  // ─── Append message ───────────────────────────────────────────────────────────

  function appendMessage(role, rawText) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = renderMarkdown(rawText);
    messagesEl.appendChild(div);

    // Nút CTA chỉ hiện cho tin nhắn bot có link form đặt hàng
    if (role === 'bot') {
      const foundUrl = detectOrderUrl(rawText);
      if (foundUrl) {
        const btn = document.createElement('a');
        btn.href = foundUrl;
        btn.target = '_blank';
        btn.rel = 'noopener noreferrer';
        btn.className = 'cta-btn';
        btn.innerHTML = '<span class="cta-icon">📝</span> Mở form đặt hàng MISU';
        messagesEl.appendChild(btn);
      }
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // ─── Typing indicator ─────────────────────────────────────────────────────────

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.textContent = 'MISU đang trả lời...';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // ─── Tin nhắn chào ────────────────────────────────────────────────────────────
  appendMessage('bot', 'Xin chào anh/chị! Em là nhân viên tư vấn của **MISU** 😊\n\nAnh/chị đang cần kệ cho không gian nào – bếp, phòng khách, phòng ngủ hay góc làm việc ạ?');

  // ─── Send message ─────────────────────────────────────────────────────────────

  async function sendMessage(overrideText) {
    const text = overrideText || inputEl.value.trim();
    if (!text || isLoading) return;

    inputEl.value = '';
    inputEl.style.height = '44px';
    isLoading = true;
    sendBtn.disabled = true;

    appendMessage('user', text);
    chatHistory.push({ role: 'user', content: text });
    showTyping();

    try {
      const res = await fetch(getServerUrl() + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: chatHistory.slice(-10) }),
      });

      removeTyping();

      if (!res.ok) {
        const errData = await res.json();
        appendMessage('error', '⚠️ ' + (errData.error || 'Có lỗi xảy ra.'));
        return;
      }

      const data  = await res.json();
      const reply = data.reply || 'Dạ anh/chị có thể nói rõ hơn để em tư vấn tốt hơn không ạ?';
      appendMessage('bot', reply);
      chatHistory.push({ role: 'assistant', content: reply });

    } catch {
      removeTyping();
      appendMessage('error', '⚠️ Không kết nối được server. Kiểm tra lại địa chỉ server.');
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function sendChip(el) {
    sendMessage(el.textContent.trim());
  }

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = '44px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  serverUrlEl.addEventListener('change', checkHealth);
</script>
</body>
</html>
